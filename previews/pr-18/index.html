<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simbot</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center;
    font: 16px/1.6 -apple-system, system-ui, sans-serif;
    background: #0f1115; color: #e7e9ee; padding: 24px;
  }
  @media (prefers-color-scheme: light) { body { background: #f6f7f9; color: #1b1e24; } }
  .card { max-width: 460px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 8px 0; color: #8b93a3; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: #3fb950; margin-right: 6px; vertical-align: middle; }
</style></head><body>
  <div class="card">
    <h1>simbot</h1>
    <p><span class="dot"></span>Assistant mode</p>
    <p>The public life-sim dashboard has been retired. simbot now runs privately
       as a personal assistant over Telegram — there's nothing to see here.</p>
  </div>
</body></html>
